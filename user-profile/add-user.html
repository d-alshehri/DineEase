<h1>Sign up page</h1>

<form class="user-form"  action="Profile.html" method="get">

<fieldset>
        <legend>Personal details</legend>

        <div class="form-grid">
        <div class="field">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" placeholder="e.g. Ahmed Ali"
                    required minlength="3" maxlength="50">
        </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="field">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" placeholder="05XXXXXXXX"
                    pattern="05[0-9]{8}" title="Enter 10 digits starting with 05" required>
            </div>

            <div class="field">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" name="dob" min="1950-01-01" max="2008-12-31" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8"
                    pattern="(?=.*[0-9])(?=.*[A-Za-z]).{8,}"
                    title="At least 8 characters, including letters and numbers" required>
            </div>

            <div class="field">
                <label for="photo">Profile photo (optional)</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>
        </div>
        <div class="button-row">
                <button type="submit" class="button" >Add User</button>
                <button type="reset" class="button button-outline">Reset</button>
            </div>
    <a href="login.html" class="add-user-button">have an account? Sign up</a>

    </fieldset>
   
            
</form>
