<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your DineEase account.">

    <title>DineEase - Log In</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Userprofile.css">
    <link rel="stylesheet" href="../css/user.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">DineEase</h1>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#features">Features</a></li>
                <li><a href="../index.html#pricing">Pricing</a></li>
                <li><a href="../plans/plan-details.html">Plans</a></li>
                <li><a href="../support.html">Support</a></li>
                <li><a href="login.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <h1>Log In</h1>

    <form class="user-form login-form" action="Profile.html" method="get">

        <fieldset>
            <legend>Welcome back</legend>

            <div class="form-grid">
                <div class="field full">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="field full">
                    <label for="password">Password</label>
                    <input type="password" id="password" minlength="8" title="At least 8 characters" required>
                </div>
            </div>

            <div class="button-row">
                <button type="submit" class="button">Log In</button>
            </div>

            <a href="add-user.html" class="add-user-button">Don't have an account? Sign up</a>
        </fieldset>

    </form>


    <footer>
        <p>DineEase - Making Dining Easier.</p>
        <a href="../support.html">Contact Support</a>
        <p>&copy; 2026 DineEase. All rights reserved.</p>
    </footer>
</body>

</html>
